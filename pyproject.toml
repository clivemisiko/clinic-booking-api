[project]
name = "clinic-booking"
version = "1.0.0"
description = "Clinic appointment booking API (FastAPI + PostgreSQL)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI's Query()/Depends() defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder
